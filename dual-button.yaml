blueprint:
  name: Bilresa Dual Button - Area Lights
  description: >
    Controls lights in an area using a Bilresa dual button.
    Button 1 single press toggles the lights.
    Button 2 cycles brightness: 5%, 20%, 40%, 100%.
    Button 1 double press sets the lights to 100%.
    Button 1 long press activates a reset scene.
  domain: automation

  input:
    room_area:
      name: Room Area
      description: Area containing the lights to control.
      selector:
        area: {}

    button_1_position:
      name: Button 1 Position Sensor
      selector:
        entity:
          domain: sensor

    button_2_position:
      name: Button 2 Position Sensor
      selector:
        entity:
          domain: sensor

    button_1_event:
      name: Button 1 Event
      selector:
        entity:
          domain: event

    reset_scene:
      name: Reset Scene
      selector:
        entity:
          domain: scene

triggers:
  - trigger: numeric_state
    entity_id: !input button_1_position
    above: 0
    id: toggle

  - trigger: numeric_state
    entity_id: !input button_2_position
    above: 0
    id: brightness

  - trigger: event.received
    target:
      entity_id: !input button_1_event
    options:
      event_type:
        - multi_press_2
    id: full_brightness

  - trigger: event.received
    target:
      entity_id: !input button_1_event
    options:
      event_type:
        - long_press
    id: reset_lights

conditions: []

actions:
  - choose:

      # Button 1 - toggle
      - conditions:
          - condition: trigger
            id: toggle
        sequence:
          - action: light.toggle
            target:
              area_id: !input room_area
            data:
              transition: 0.4

      # Button 2 - brightness cycle
      - conditions:
          - condition: trigger
            id: brightness
        sequence:
          - variables:
              selected_area: !input room_area

          - variables:
              max_brightness: >
                {% set lights = area_entities(selected_area)
                  | select('match', '^light\.')
                  | list %}
                {% set ns = namespace(max=0) %}
                {% for entity in lights %}
                  {% set brightness = state_attr(entity, 'brightness') %}
                  {% if brightness is not none and brightness > ns.max %}
                    {% set ns.max = brightness %}
                  {% endif %}
                {% endfor %}
                {{ ns.max }}

          - choose:

              # 5% / off -> 20%
              - conditions:
                  - condition: template
                    value_template: >
                      {{ (max_brightness | int(0) / 255 * 100) <= 15 }}
                sequence:
                  - action: light.turn_on
                    target:
                      area_id: !input room_area
                    data:
                      brightness_pct: 20
                      transition: 0.4

              # 20% -> 40%
              - conditions:
                  - condition: template
                    value_template: >
                      {{ (max_brightness | int(0) / 255 * 100) <= 35 }}
                sequence:
                  - action: light.turn_on
                    target:
                      area_id: !input room_area
                    data:
                      brightness_pct: 40
                      transition: 0.4

              # 40% -> 100%
              - conditions:
                  - condition: template
                    value_template: >
                      {{ (max_brightness | int(0) / 255 * 100) <= 80 }}
                sequence:
                  - action: light.turn_on
                    target:
                      area_id: !input room_area
                    data:
                      brightness_pct: 100
                      transition: 0.4

            # 100% -> 5%
            default:
              - action: light.turn_on
                target:
                  area_id: !input room_area
                data:
                  brightness_pct: 5
                  transition: 0.4

      # Button 1 - double press
      - conditions:
          - condition: trigger
            id: full_brightness
        sequence:
          - action: light.turn_on
            target:
              area_id: !input room_area
            data:
              brightness_pct: 100
              transition: 0.4

      # Button 1 - long press
      - conditions:
          - condition: trigger
            id: reset_lights
        sequence:
          - action: scene.turn_on
            target:
              entity_id: !input reset_scene
            data:
              transition: 0.4

mode: queued
