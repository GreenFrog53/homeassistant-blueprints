blueprint:
  name: Bilresa Dual Button - Area Lights
  description: >
    Controls the lights in an area using a Bilresa dual button.
    Button 1 single press toggles the area lights.
    Button 2 cycles brightness between 5%, 20%, 40% and 100%.
    Button 1 double press sets the area lights to 100%.
    Button 1 long press activates a selected reset scene.
  domain: automation

  input:
    room_area:
      name: Room Area
      description: >
        The area containing the lights controlled by this automation.
      selector:
        area:

    button_1_position:
      name: Button 1 Position Sensor
      description: >
        Sensor representing the current position of button 1.
      selector:
        entity:
          domain: sensor

    button_2_position:
      name: Button 2 Position Sensor
      description: >
        Sensor representing the current position of button 2.
      selector:
        entity:
          domain: sensor

    button_1_event:
      name: Button 1 Event
      description: >
        Bilresa button 1 event entity.
      selector:
        entity:
          domain: event

    reset_scene:
      name: Reset Scene
      description: >
        Scene activated by a long press of button 1.
      selector:
        entity:
          domain: scene

triggers:
  # Button 1 - single press
  - trigger: numeric_state
    entity_id: !input button_1_position
    above: 0
    id: toggle

  # Button 2 - single press
  - trigger: numeric_state
    entity_id: !input button_2_position
    above: 0
    id: brightness

  # Button 1 - double press
  - trigger: event.received
    target:
      entity_id: !input button_1_event
    options:
      event_type:
        - multi_press_2
    id: full_brightness

  # Button 1 - long press
  - trigger: event.received
    target:
      entity_id: !input button_1_event
    options:
      event_type:
        - long_press
    id: reset_lights

conditions: []

actions:
  - choose:

      # ==========================================
      # BUTTON 1 - TOGGLE
      # ==========================================
      - conditions:
          - condition: trigger
            id: toggle
        sequence:
          - action: light.toggle
            target:
              area_id: !input room_area
            data:
              transition: 0.4

      # ==========================================
      # BUTTON 2 - BRIGHTNESS CYCLE
      # ==========================================
      - conditions:
          - condition: trigger
            id: brightness
        sequence:

          - variables:
              area_lights: >
                {{ area_entities(!input room_area)
                   | select('match', '^light\.')
                   | list }}

              brightness_entity: >
                {{ area_entities(!input room_area)
                   | select('match', '^light\.')
                   | list
                   | first }}

          - choose:

              # 5% -> 20%
              - conditions:
                  - condition: template
                    value_template: >
                      {{ (state_attr(brightness_entity, 'brightness')
                          | int(0) / 255 * 100) <= 15 }}
                sequence:
                  - action: light.turn_on
                    target:
                      area_id: !input room_area
                    data:
                      brightness_pct: 20
                      transition: 0.4

              # 20% -> 40%
              - conditions:
                  - condition: template
                    value_template: >
                      {{ (state_attr(brightness_entity, 'brightness')
                          | int(0) / 255 * 100) <= 35 }}
                sequence:
                  - action: light.turn_on
                    target:
                      area_id: !input room_area
                    data:
                      brightness_pct: 40
                      transition: 0.4

              # 40% -> 100%
              - conditions:
                  - condition: template
                    value_template: >
                      {{ (state_attr(brightness_entity, 'brightness')
                          | int(0) / 255 * 100) <= 80 }}
                sequence:
                  - action: light.turn_on
                    target:
                      area_id: !input room_area
                    data:
                      brightness_pct: 100
                      transition: 0.4

            # 100% -> 5%
            default:
              - action: light.turn_on
                target:
                  area_id: !input room_area
                data:
                  brightness_pct: 5
                  transition: 0.4

      # ==========================================
      # BUTTON 1 - DOUBLE PRESS
      # ==========================================
      - conditions:
          - condition: trigger
            id: full_brightness
        sequence:
          - action: light.turn_on
            target:
              area_id: !input room_area
            data:
              brightness_pct: 100
              transition: 0.4

      # ==========================================
      # BUTTON 1 - LONG PRESS
      # ==========================================
      - conditions:
          - condition: trigger
            id: reset_lights
        sequence:
          - action: scene.turn_on
            target:
              entity_id: !input reset_scene
            data:
              transition: 0.4

mode: queued
